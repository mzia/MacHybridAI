name: "CI, Unit Tests & macOS Packaging"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-unit-tests:
    name: Python Engine Unit Tests (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python Backend & Test Suite Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit & Integration Tests with Coverage
        working-directory: backend
        run: |
          pytest -v \
            --cov=machybrid \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Lint with Ruff
        working-directory: backend
        run: |
          ruff check machybrid/ tests/

      - name: Verify Zero-Dependency Unittest Runner
        run: |
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  macos-swift-build-and-test:
    name: macOS SwiftUI App Build, Unit Tests & Bundle Verification
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Xcode 16 (Swift 6)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'

      - name: Verify Swift & Python Toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Build macOS Executable (Release)
        run: swift build -c release

      - name: Run Swift Unit Test Suite
        run: swift test -v

      - name: Build & Verify Self-Contained MacHybridAI.app Bundle
        run: |
          chmod +x bundle.sh package.sh
          ./bundle.sh
          test -d "MacHybridAI.app"
          test -f "MacHybridAI.app/Contents/MacOS/MacHybridAI"
          test -f "MacHybridAI.app/Contents/Resources/backend/machybrid/server.py"

      - name: Build macOS Distributables (.pkg & .dmg)
        run: |
          ./package.sh
          test -f dist/MacHybridAI-1.0.0.pkg
          test -f dist/MacHybridAI-1.0.0.dmg

      - name: Upload macOS Installer Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MacHybridAI-macOS-Distributables
          path: dist/*
          retention-days: 14
